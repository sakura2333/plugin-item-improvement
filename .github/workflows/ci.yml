name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install development dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Test bundled data and self-updater contracts
        run: npm test

      - name: Verify official package
        run: npm pack --dry-run

      - name: Verify beta package and workspace restoration
        run: npm run publish:beta:dry-run
