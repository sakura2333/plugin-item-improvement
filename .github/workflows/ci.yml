name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Test minimum locked data package
        run: npm test

      - name: Verify official package
        run: npm pack --dry-run

      - name: Verify beta package and workspace restoration
        run: npm run publish:beta:dry-run

      - name: Test latest compatible data package
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund '@sakura2333/kancolle-data@>=0.1.0 <0.3.0'
          npm test
